name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: linux (tests, helper, windows type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu }
      - uses: Swatinem/rust-cache@v2
      - name: Install npm dependencies
        run: npm ci
      - name: Build focus-helper (needed by tests/focus-stdio.test.js)
        run: cargo build --manifest-path focus-helper/Cargo.toml --features test-clock
      - name: focus-helper unit tests
        run: cargo test --manifest-path focus-helper/Cargo.toml
      - name: focus-helper unit tests (test-clock feature)
        run: cargo test --manifest-path focus-helper/Cargo.toml --features test-clock
      - name: Regenerate shared vectors and partner page, fail on diff
        run: |
          node scripts/gen-decide-vectors.js
          node scripts/gen-item-vectors.js
          node scripts/build-partner-page.js
          git diff --exit-code -- tests/fixtures/decide-vectors.json tests/fixtures/item-vectors.json src/modules/focus/partner-unlock.html
      - name: Type-check Windows-only code
        run: |
          cargo check --manifest-path focus-helper/Cargo.toml --target x86_64-pc-windows-gnu --all-targets
          cargo check --manifest-path focus-helper/Cargo.toml --target x86_64-pc-windows-gnu --all-targets --features test-clock
      - name: JS tests
        run: npm test
